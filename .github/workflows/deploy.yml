name: CivicSolve CI/CD — GitHub & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXTAUTH_SECRET: 'civicsolve-secret-key-production-sih2025'

      - name: Build Docker Container Image
        run: docker build -t civicsolve:latest .
